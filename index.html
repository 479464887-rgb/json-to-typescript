  <main>
    <h1 style="font-size:24px;margin-bottom:4px">JSON to TypeScript</h1>
    <p style="color:#8b949e;font-size:14px;margin-bottom:8px">在线 JSON 转 TypeScript 接口定义 - 自动Generate TS 类型</p>
    <div class="tool-wrapper"><textarea id="j2t-input" placeholder='{&quot;user&quot;:{&quot;name&quot;:&quot;Alice&quot;,&quot;age&quot;:30,&quot;tags&quot;:[&quot;dev&quot;]}}' rows="8" style="width:100%;padding:16px;font-size:13px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#c9d1d9;resize:vertical;outline:none;font-family:mono;line-height:1.6;min-height:200px"></textarea>
      <div style="display:flex;gap:8px;margin:12px 0;align-items:center"><input type="text" id="j2t-name" placeholder="RootName" value="Root" style="padding:10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;outline:none;width:150px"><button class="btn btn-primary" style="padding:10px 24px;background:#238636;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600" onclick="convertJ2T()">Generate TypeScript</button><button class="btn" style="padding:10px 20px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:8px;cursor:pointer;font-size:13px" onclick="navigator.clipboard.writeText(document.getElementById('j2t-output').value)">📋 Copy</button></div><textarea id="j2t-output" readonly rows="10" style="width:100%;padding:16px;font-size:13px;border:1px solid #30363d;border-radius:8px;background:#161b22;color:#c9d1d9;resize:vertical;outline:none;font-family:mono;line-height:1.6;min-height:200px"></textarea>
    </div>
  </main>
  <footer><a href="https://github.com/479464887-rgb/json-to-typescript">GitHub</a><span>·</span><span>© 2026 DevKit</span></footer>
  <script>
    function j2tType(val, name) {
      if (val === null) return 'null';
      if (Array.isArray(val)) {
        if (!val.length) return 'any[]';
        const t = j2tType(val[0], '');
        return t + '[]'
      }
      if (typeof val === 'object') {
        let s = `export interface ${name} {\n`;
        Object.entries(val).forEach(([k, v]) => {
          const t = j2tType(v, k.charAt(0).toUpperCase() + k.slice(1));
          s += `  ${k}: ${t};\n`
        });
        s += '}';
        return name ? s : t
      }
      if (typeof val === 'string') return 'string';
      if (typeof val === 'number') return 'number';
      if (typeof val === 'boolean') return 'boolean';
      return 'any'
    }

    function convertJ2T() {
      try {
        const obj = JSON.parse(document.getElementById('j2t-input').value.trim());
        const name = document.getElementById('j2t-name').value || 'Root';
        const result = j2tType(obj, name);
        document.getElementById('j2t-output').value = result
      } catch (e) {
        document.getElementById('j2t-output').value = '❌ ' + e.message
      }
    }
  </script>
